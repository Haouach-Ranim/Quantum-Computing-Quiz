<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Computing Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./images/atom.png">
</head>
<body>
    <header>
        <h1>Quantum Computing Quiz</h1>
        <p>Three levels, ten flip cards each. Finish a level to unlock the next one.</p>
    </header>

    <main>
        <section id="home">
            <h2>Choose a level</h2>
            <div class="levels" id="levels"></div>
        </section>

        <section id="quiz" hidden>
            <div class="topbar">
                <button type="button" id="back" class="btn secondary">Levels</button>
                <h2 id="level-title"></h2>
                <p id="progress"></p>
            </div>

            <div id="result" class="result" hidden>
                <p class="score" id="score"></p>
                <p id="feedback"></p>
                <div class="actions">
                    <button type="button" id="retry" class="btn">Retry Wrong Answers</button>
                    <button type="button" id="next" class="btn">Next level</button>
                </div>
                <p class="hint">Tap a card to see the question and the correct answer.</p>
            </div>

            <div class="grid" id="grid"></div>

            <div class="actions center">
                <button type="button" id="finish" class="btn" hidden>See my results</button>
            </div>
        </section>
    </main>

    <footer>
        <p>Mini-projet Web FIA3 · ISSAT Sousse</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
